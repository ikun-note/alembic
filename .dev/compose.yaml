# PostgreSQL 16 for local exploration. Recreatable: `down -v` to reset.
# Password is required and read from the environment (single source: backend/.env).
# Run: podman compose --env-file backend/.env -f .dev/compose.yaml up -d
services:
  postgres:
    image: postgres:16
    container_name: alembic_lab_pg
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alembic_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:-alembic_lab}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - alembic_lab_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alembic_lab} -d ${POSTGRES_DB:-alembic_lab}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  alembic_lab_pg_data:
